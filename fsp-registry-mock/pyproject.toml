[project]
name = "fsp-registry-mock"
version = "0.1.0"
description = "Имитация реестра ФСП с предложенной командой схемой данных (соревнования, результаты, разряды)"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["registry"]
