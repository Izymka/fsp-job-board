        action_effect: "снижение повторных жалоб и оттока"
        action_kw: "повторн|отток|снижени"
      context: |
        Коллега обучил модель, которая по тексту обращения в поддержку решает, нужна ли эскалация
        старшему специалисту, и докладывает: accuracy на тесте — 97%. Эскалации нужны в {{rate}}%
        обращений. На вход подаются текст обращения, история переписки и поле «назначен старший
        специалист». Разбиение — случайное 80/20 по обращениям; у клиента в среднем шесть обращений,
