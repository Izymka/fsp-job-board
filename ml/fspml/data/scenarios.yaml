      industries: [sport, media]
      vars:
        negative: "фола нет"
        leak_feature: "свисток судьи в следующие 3 секунды"
        leak_kw: "свист|судь"
        event: "решения судьи"
        unit: "матч"
        units_dat: "матчам"
        unit_kw: "матч"
        rows: "соседние перекрывающиеся фрагменты одного матча"
        rows_kw: "фрагмент|перекры|соседн|кадр"
        business_cost: "цена пропущенного фола и лишнего пересмотра"
        capacity: "50"
        capacity_text: "Видеоассистент судьи успевает пересмотреть только 50 эпизодов за матч"
        action_effect: "долю исправленных судейских решений"
        action_kw: "исправл|пересмотр|решени"
      context: |
