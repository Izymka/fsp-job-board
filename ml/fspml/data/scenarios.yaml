        подаются кадры фрагмента и метаданные: минута матча, счёт и флаг «свисток судьи в следующие
        3 секунды». Фрагменты нарезаны из 40 матчей с шагом 1 секунда (соседние перекрываются),
        разбиение — случайное 80/20 по фрагментам.
    - id: sport_injury
