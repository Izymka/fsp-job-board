        и докладывает: accuracy на тесте — 97%. Травмы — в {{rate}}% записей. Признаки: тренировочная
        нагрузка за неделю, пульс покоя, сон, пропущенные тренировки, дата начала реабилитации.
        Разбиение — случайное 80/20 по строкам; у каждого спортсмена — ежедневные записи за сезон.
    - id: support_nlp
      title: Классификатор эскалаций с точностью 97%
      directions: [nlp]
      industries: [ecommerce, telecom]
      vars:
        negative: "эскалация не нужна"
        leak_feature: "назначен старший специалист"
        leak_kw: "старш|назначен"
        event: "эскалации"
        unit: "клиента"
        units_dat: "клиентам"
        unit_kw: "клиент"
        rows: "обращения одного клиента и копии одного шаблона"
        rows_kw: "дубл|шаблон|копи"
        business_cost: "цена пропущенной жалобы и лишней нагрузки на старших"
        capacity: "200"
