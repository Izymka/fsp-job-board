# Практические кейсы второго этапа теста (Middle, Senior, Lead).
#
# Зачем. Тест знаний (CAT) хорошо отделяет Intern/Junior, но грейд выше определяют не знания, а
# самостоятельность, работа с неопределённостью, компромиссы и архитектура (карьерные матрицы
# GitLab/Dropbox; Sackett et al., 2022: рабочие образцы и структурированное интервью — самые
# валидные методы отбора). Кейс — короткий рабочий образец уровня грейда + уточняющий вопрос
# с таймером по ответу кандидата («почему так?», «что если требование изменится?») — формат,
# который сложнее всего пройти, пересказывая чужой ответ (Meta AI-enabled coding, 2025;
# conversational exam, Barba & Stegner, 2026).
#
# Кейс фиксирован и написан заранее — сложность не генерируется нейросетью под кандидата (ТЗ).
# LLM только оценивает ответ по рубрике и выбирает уточняющий вопрос из заранее заданных.
#
# Рубрика — шкала с описанными уровнями (BARS) на каждый критерий:
#   0 — не затронуто или неверно; 1 — в общих словах, без конкретики или с ошибками;
#   2 — `expect` (ожидание уровня грейда); 3 — `expect` + `strong` (сверх уровня).
# `keywords` — регулярные выражения для резервной оценки, если LLM недоступен.
# Параметры варианта: {{name}} подставляется значением из `params` (по seed попытки);
# `derived` — простые выражения от параметров (сложение/вычитание).

- id: be.middle.slow_orders
  spec: backend
  grade: middle
  skill: sql
  title: Медленный список заказов
  params:
    n: [50, 200, 500]
    sec: ["1,8", "3,5", "6"]
  context: |
    Эндпоинт `GET /users/{id}/orders` отвечает за {{sec}} с у клиентов, у которых около {{n}} заказов.
    Таблица `orders` — 40 млн строк, `order_items` — 300 млн. База — PostgreSQL. Код обработчика:
  code: |
    @router.get("/users/{user_id}/orders")
    def list_orders(user_id: int, db: Session = Depends(get_db)):
        orders = db.query(Order).filter(Order.user_id == user_id).all()
        result = []
        for o in orders:
            items = db.query(OrderItem).filter(OrderItem.order_id == o.id).all()
            result.append({"id": o.id, "total": sum(i.price * i.qty for i in items),
                           "items": [i.sku for i in items]})
        return result
  code_lang: python
  task: |
    Найдите причины медленной работы, предложите исправление (код или описание) и объясните,
    как проверите, что стало лучше.
  criteria:
    - id: diagnosis
      title: Диагноз
      weight: 1.2
      expect: "назван паттерн N+1 (1 + N запросов к order_items), вероятное отсутствие индексов по orders.user_id и order_items.order_id"
      strong: "оценено число запросов и вклад каждого фактора; замечена выдача без пагинации"
      keywords: ["n\\s*\\+\\s*1", "запрос\\w* в цикле|в цикле.*запрос", "индекс", "user_id", "order_id"]
    - id: fix
      title: Исправление
      weight: 1.2
      expect: "загрузка позиций одним запросом (JOIN/selectinload/IN), индексы на внешние ключи, пагинация"
      strong: "агрегация total на стороне БД или денормализация с обоснованием, ограничение размера ответа"
      keywords: ["join", "selectinload|joinedload|prefetch", "\\bin\\s*\\(", "пагинац|limit|offset|cursor", "create index|индекс"]
    - id: verify
      title: Проверка
      weight: 0.8
      expect: "EXPLAIN ANALYZE / лог SQL-запросов до и после, замер времени ответа"
      strong: "нагрузочный тест или метрики p95/p99 в мониторинге, тест на число запросов"
      keywords: ["explain", "analyze", "p9[59]|перцентил", "нагрузочн|locust|k6", "лог\\w* sql|echo"]
  probes:
    - criterion: diagnosis
      text: "Сколько запросов к базе выполнит этот обработчик для клиента с {{n}} заказами и почему именно столько?"
      expect: "{{n}} + 1 запрос: один за заказами и по одному на каждый заказ"
      keywords: ["\\+\\s*1", "кажд\\w* заказ", "цикл"]
    - criterion: fix
      text: "Чем selectinload отличается от joinedload и что вы выберете для этого эндпоинта?"
      expect: "joinedload — один запрос с JOIN (дублирование строк заказа), selectinload — второй запрос с IN; для коллекций с многими позициями обычно selectinload"
      keywords: ["join", "\\bin\\b", "дублир|декартов|размнож", "второй запрос|два запроса"]
    - criterion: verify
      text: "После выката время ответа не изменилось. Что проверите в первую очередь?"
      expect: "что индекс действительно используется (EXPLAIN), что новый код задеплоен, статистика таблиц, план запроса"
      keywords: ["explain", "план", "analyze|статистик", "индекс"]
  twist:
    text: "У крупного клиента 100 000 заказов, и он просит выгрузку всех заказов одним ответом. Что предложите?"
    expect: "асинхронная выгрузка (фоновая задача + файл/ссылка) или потоковая отдача, пагинация курсором, лимиты"
    keywords: ["асинхрон|фон|очеред", "stream|потоков", "cursor|курсор", "файл|csv|s3"]

- id: be.senior.double_payment
  spec: backend
  grade: senior
  skill: architecture
  title: Двойное зачисление платежей
  params:
    rps: [80, 300, 1200]
    share: ["0,3", "0,8", "1,5"]
  context: |
    Платёжный провайдер присылает вебхуки «платёж успешен» по принципу at-least-once и повторяет
    запрос, если не получил 200 за 5 с. Нагрузка — до {{rps}} вебхуков в секунду. После роста
    нагрузки {{share}}% платежей начали зачисляться на баланс дважды. Обработчик: читает платёж по
    `external_id`, если статус `pending` — увеличивает баланс пользователя и ставит статус `paid`.
    Сервис работает в 6 репликах, база — PostgreSQL.
  task: |
    Объясните, почему возникают двойные зачисления, предложите архитектурное решение и опишите,
    что делать с уже пострадавшими данными и как не допустить повторения.
  criteria:
    - id: cause
      title: Причина
      weight: 1.0
      expect: "гонка между параллельными обработками одного вебхука (повтор + несколько реплик): проверка статуса и обновление не атомарны"
      strong: "объяснено, почему проблема проявилась именно с ростом нагрузки (таймауты → повторы → параллельность)"
      keywords: ["гонк|race", "параллельн|одновремен", "атомарн", "повтор|retry|at.least.once", "таймаут"]
    - id: design
      title: Решение
      weight: 1.4
      expect: "идемпотентность: уникальный ключ external_id, атомарный переход статуса (UPDATE ... WHERE status='pending' / SELECT FOR UPDATE / insert-if-not-exists), изменение баланса в той же транзакции"
      strong: "журнал проводок (ledger) вместо мутации баланса, быстрый ответ 200 + асинхронная обработка через inbox/очередь"
      keywords: ["идемпотент", "уникальн|unique", "for update|блокировк", "where status|compare.and|cas", "транзакц", "ledger|проводк|журнал", "inbox|outbox|очеред"]
    - id: remediation
      title: Пострадавшие данные
      weight: 0.8
      expect: "сверка (reconciliation) с выгрузкой провайдера, поиск дублей, корректирующие проводки, коммуникация с поддержкой/финансами"
      strong: "регулярная автоматическая сверка, порядок отката без потери легитимных операций"
      keywords: ["сверк|reconcil", "дубл", "корректир|сторн|откат", "финанс|бухгалт|поддержк"]
    - id: prevention
      title: Предотвращение
      weight: 0.8
      expect: "тест на конкурентные повторы, алерт на расхождение баланса и суммы проводок, метрики повторов вебхуков"
      strong: "инварианты в БД (constraint), нагрузочный тест с повторами, постмортем без поиска виноватых"
      keywords: ["тест", "алерт|монитор|метрик", "constraint|ограничени", "постмортем|postmortem"]
  probes:
    - criterion: cause
      text: "Почему проблема не проявлялась при низкой нагрузке, хотя код не менялся?"
      expect: "при росте нагрузки обработка дольше 5 с → провайдер повторяет → две обработки идут параллельно в разных репликах"
      keywords: ["таймаут|5 с", "повтор", "параллельн|одновремен", "реплик"]
    - criterion: design
      text: "Почему недостаточно просто проверить статус `pending` перед зачислением?"
      expect: "проверка и обновление — две операции: между ними другая реплика успевает прочитать тот же статус (check-then-act)"
      keywords: ["между", "check.then.act|проверк\\w* и обновлен", "атомар", "обе|две реплик"]
    - criterion: remediation
      text: "Финансы просят просто списать лишние суммы со всех балансов. Ваши действия?"
      expect: "не списывать вслепую: сверка с провайдером, разбор кейсов (часть пользователей уже потратила деньги), корректирующие проводки, коммуникация"
      keywords: ["сверк", "уже потрат|отрицательн", "проводк|корректир", "коммуникац|уведом"]
  twist:
    text: "Провайдер иногда присылает «платёж отменён» раньше, чем «платёж успешен». Как это меняет решение?"
    expect: "события приходят не по порядку: машина состояний с допустимыми переходами, версии/время события, финальные статусы не перезаписываются"
    keywords: ["порядок|order", "машин\\w* состояни|state machine|переход", "верси|timestamp|время событ", "финальн"]

- id: be.lead.monolith_split
  spec: backend
  grade: lead
  skill: architecture
  title: Распил монолита
  params:
    people: [12, 18, 25]
  context: |
    Вы техлид направления. Монолит на Python, {{people}} разработчиков в трёх продуктовых командах.
    Релиз раз в две недели, каждый пятый релиз откатывают, сборка и тесты идут 50 минут, команды
    постоянно конфликтуют в общих модулях. CTO предлагает «за квартал перейти на микросервисы».
  task: |
    Как вы примете решение и что предложите CTO? Опишите варианты, их цену, план и то, по каким
    метрикам поймёте, что стало лучше.
  criteria:
    - id: diagnosis
      title: Диагноз проблемы
      weight: 1.0
      expect: "разделены симптомы и причины: связность модулей, медленный CI, отсутствие владения кодом, большие релизы; микросервисы — средство, а не цель"
      strong: "предложено сначала собрать данные (где конфликты, что ломает релизы, профиль CI)"
      keywords: ["связност|coupling", "ci|сборк", "владени|ownership", "причин", "данн|измер"]
    - id: options
      title: Варианты и компромиссы
      weight: 1.3
      expect: "сравнены минимум два варианта (модульный монолит, постепенное выделение сервисов — strangler fig, полный переход) с ценой распределённой системы: сеть, консистентность, наблюдаемость, DevOps-нагрузка"
      strong: "критерии выбора границ (домены, DDD, частота изменений), риск «распределённого монолита»"
      keywords: ["модульн\\w* монолит", "strangler|постепен", "распределённ|сетев|консистентн", "домен|ddd|bounded", "наблюдаем|observability"]
    - id: plan
      title: План и метрики
      weight: 1.0
      expect: "поэтапный план с первым шагом на 2–4 недели, метрики DORA (частота деплоя, lead time, доля неудачных изменений, время восстановления)"
      strong: "критерии остановки/пересмотра, ускорение CI и релизов как быстрые победы"
      keywords: ["dora|частот\\w* деплоя|lead time|change fail", "этап|поэтап", "метрик", "ci|сборк"]
    - id: people
      title: Люди и процесс
      weight: 0.9
      expect: "границы владения командами (закон Конвея), согласование с бизнесом по скорости фич во время переделки"
      strong: "план коммуникации с CTO на языке рисков и денег, обучение команды"
      keywords: ["конве|conway", "команд", "бизнес", "владени|ownership", "риск"]
  probes:
    - criterion: options
      text: "CTO отвечает: «Модульный монолит — полумера, хочу микросервисы». Что вы ему скажете?"
      expect: "аргументы по цене и рискам, предложение выделить 1–2 сервиса по чётким критериям как эксперимент с метриками"
      keywords: ["цен|стоимост", "риск", "эксперимент|пилот", "метрик"]
    - criterion: plan
      text: "Какие три цифры вы покажете через квартал, чтобы доказать, что изменения сработали?"
      expect: "метрики DORA или аналоги: частота релизов, доля откатов, время сборки/lead time"
      keywords: ["частот|релиз", "откат|change fail", "lead time|время сборк|ci"]
    - criterion: people
      text: "Одна из команд против изменений: «у нас дедлайн по фичам». Как поступите?"
      expect: "договорённость о бюджете времени (например, доля спринта), приоритизация с продуктом, показ пользы для самой команды"
      keywords: ["бюджет|доля|процент", "продукт|приоритет", "польз|выгод"]
  twist:
    text: "Бюджет урезали: в ближайший квартал нельзя тратить на техдолг больше 15% времени. Что останется в плане?"
    expect: "приоритизация по эффекту: ускорение CI, модульные границы в самых конфликтных местах, отказ от массового распила"
    keywords: ["приоритет", "ci|сборк", "границ|модул", "отказ|отлож"]

- id: fe.middle.search_race
  spec: frontend
  grade: middle
  skill: react
  title: Поиск показывает чужие результаты
  params:
    delay: [300, 800, 1500]
  context: |
    Пользователи жалуются: при быстром наборе в строке поиска иногда отображаются результаты не по
    последнему запросу. Сервер отвечает от 100 до {{delay}} мс. Компонент:
  code: |
    function Search() {
      const [q, setQ] = useState('')
      const [items, setItems] = useState([])
      useEffect(() => {
        fetch(`/api/search?q=${q}`)
          .then((r) => r.json())
          .then((data) => setItems(data.items))
      }, [q])
      return (<>
        <input value={q} onChange={(e) => setQ(e.target.value)} />
        <List items={items} />
      </>)
    }
  code_lang: tsx
  task: |
    Объясните причину бага, исправьте компонент и перечислите, что ещё в нём стоит улучшить.
  criteria:
    - id: diagnosis
      title: Диагноз
      weight: 1.2
      expect: "гонка запросов: ответы приходят не в порядке отправки, и более старый ответ перезаписывает новый"
      strong: "отмечено, что запрос уходит на каждую букву и при пустой строке"
      keywords: ["гонк|race", "порядк|не по порядку|out.of.order", "старый ответ|перезапис", "кажд\\w* (букв|символ|нажат)"]
    - id: fix
      title: Исправление
      weight: 1.2
      expect: "отмена/игнор устаревших ответов: AbortController в cleanup эффекта или флаг ignore; debounce ввода"
      strong: "кэширование/библиотека запросов (React Query/SWR), encodeURIComponent для q"
      keywords: ["abortcontroller|abort", "cleanup|return \\(\\) =>", "ignore|cancel|отмен", "debounce|задержк", "react.query|swr|encodeuri"]
    - id: ux
      title: Состояния и крайние случаи
      weight: 0.8
      expect: "состояния загрузки и ошибки, пустой запрос, пустой результат, обработка ошибки сети"
      strong: "доступность (aria-live), сохранение запроса в URL"
      keywords: ["загрузк|loading|спиннер", "ошибк|error|catch", "пуст", "aria|url"]
  probes:
    - criterion: diagnosis
      text: "Опишите по шагам, как именно на экран попадают результаты не по последнему запросу."
      expect: "запрос A отправлен раньше B, но B вернулся первым и отрисовался, затем пришёл A и перезаписал состояние"
      keywords: ["раньше|позже|первым", "перезапис", "a.*b|первый.*втор"]
    - criterion: fix
      text: "Почему debounce сам по себе не исправляет этот баг?"
      expect: "debounce уменьшает число запросов, но два запроса всё ещё могут вернуться не по порядку"
      keywords: ["меньше|сокращ", "не по порядку|порядок|всё равно|по-прежнему", "гонк"]
    - criterion: ux
      text: "Сервер начал иногда отвечать 500. Что увидит пользователь сейчас и что должен видеть?"
      expect: "сейчас — ничего/упавший промис или старые результаты; нужно сообщение об ошибке и возможность повторить, без сброса предыдущих результатов без объяснения"
      keywords: ["ошибк", "повтор|retry", "catch|r\\.ok|status"]
  twist:
    text: "Продакт хочет, чтобы поиск работал офлайн по последним результатам. Что поменяете?"
    expect: "кэширование ответов (in-memory/IndexedDB/service worker), показ пометки «данные могут быть устаревшими», стратегия stale-while-revalidate"
    keywords: ["кэш|cache", "indexeddb|localstorage|service worker", "stale|устарев"]

- id: fe.senior.slow_lcp
  spec: frontend
  grade: senior
  skill: html_css
  title: Медленная загрузка на мобильных
  params:
    kb: [900, 1400, 2300]
    lcp: ["4,1", "5,6", "7,2"]
  context: |
    Каталог интернет-магазина на React (SPA, клиентский рендеринг). По данным реальных пользователей
    (RUM) LCP на мобильных — {{lcp}} с (p75), конверсия с мобильных на 30% ниже, чем с десктопа.
    Основной JS-бандл — {{kb}} КБ (gzip), картинки товаров загружаются в исходном размере, шрифты —
    с внешнего CDN, аналитика и чат поддержки подключены синхронно в `<head>`.
  task: |
    Как вы найдёте главные причины и в каком порядке будете их устранять? Как поймёте, что работа
    дала результат для бизнеса?
  criteria:
    - id: diagnosis
      title: Диагностика
      weight: 1.0
      expect: "измерение: Lighthouse/WebPageTest на медленном мобильном профиле, разбор waterfall, bundle analyzer, определение LCP-элемента"
      strong: "разделение лабораторных и полевых данных, сегментация RUM по устройствам/сетям"
      keywords: ["lighthouse|webpagetest|devtools", "waterfall|водопад", "bundle.analy|анализ бандла", "lcp.элемент|какой элемент", "rum|полев"]
    - id: measures
      title: Меры
      weight: 1.4
      expect: "разделение кода и ленивая загрузка, оптимизация изображений (размеры, WebP/AVIF, srcset, приоритет LCP-картинки), отложенная загрузка сторонних скриптов, шрифты (preload, font-display)"
      strong: "SSR/SSG для каталога, кэширование/CDN, критический CSS, приоритизация по эффекту на LCP"
      keywords: ["code.split|разделени\\w* код|lazy|динамическ\\w* импорт", "webp|avif|srcset|размер\\w* (картин|изображ)", "async|defer|отлож", "preload|font.display|preconnect", "ssr|ssg|серверн\\w* рендер"]
    - id: priority
      title: Приоритизация
      weight: 0.8
      expect: "порядок по соотношению эффект/усилия: сначала картинки и сторонние скрипты, затем бандл, затем архитектурные изменения (SSR)"
      strong: "согласование с бизнесом стоимости отказа/переноса сторонних скриптов"
      keywords: ["приоритет|порядок|сначала", "эффект|усили|impact", "быстр\\w* побед|quick win"]
    - id: outcome
      title: Результат
      weight: 0.8
      expect: "контроль по RUM (p75 LCP/INP/CLS), бюджеты производительности в CI, связь с конверсией через A/B или сравнение до/после"
      strong: "регрессионные алерты, учёт сезонности при оценке конверсии"
      keywords: ["p75|перцентил", "бюджет|budget", "a/b|аб.тест|эксперимент", "конверси", "ci"]
  probes:
    - criterion: measures
      text: "Что конкретно сделаете с картинкой, которая является LCP-элементом?"
      expect: "правильный размер и формат (srcset/sizes, WebP/AVIF), без lazy-loading, высокий приоритет (fetchpriority/preload), CDN"
      keywords: ["srcset|sizes|размер", "webp|avif", "fetchpriority|preload|приоритет", "не lazy|без lazy|lazy"]
    - criterion: priority
      text: "Маркетинг отказывается убирать чат и аналитику из `<head>`. Ваш компромисс?"
      expect: "асинхронная/отложенная загрузка после взаимодействия или idle, фасад для чата, измерение влияния каждого скрипта"
      keywords: ["async|defer|отлож", "фасад|facade|по клику|idle", "измер"]
    - criterion: outcome
      text: "LCP улучшился вдвое, а конверсия не изменилась. Какие выводы и следующие шаги?"
      expect: "проверить другие метрики (INP, CLS), сегменты, сезонность и корректность сравнения; производительность могла быть не главным узким местом"
      keywords: ["inp|cls", "сегмент", "сезон|сравнени", "не (главн|единствен)"]
  twist:
    text: "Команда предлагает переписать всё на Next.js с SSR. Ваша позиция?"
    expect: "оценка эффекта и стоимости, возможность поэтапного SSR/SSG для каталога, сначала дешёвые меры"
    keywords: ["стоимост|цен", "поэтап|постепен", "дешев|сначала", "эффект"]

- id: fe.lead.design_system
  spec: frontend
  grade: lead
  skill: architecture
  title: Три UI-кита в одном продукте
  params:
    teams: [4, 6]
  context: |
    В компании {{teams}} фронтенд-команд и три разных UI-кита: интерфейсы выглядят по-разному,
    одни и те же компоненты (таблицы, формы, модалки) написаны трижды, доступность не проверяется.
    Дизайнеры хотят единую дизайн-систему, продакты боятся, что это остановит разработку фич.
  task: |
    Предложите, как прийти к единой дизайн-системе: модель владения, техническое решение, план
    внедрения и как вы будете измерять успех.
  criteria:
    - id: ownership
      title: Модель владения
      weight: 1.1
      expect: "выделенная команда или федеративная модель с контрибьюторами из команд, правила вклада и ревью, версия и changelog"
      strong: "обоснован выбор модели под размер компании, роль дизайнеров в процессе"
      keywords: ["выделенн\\w* команд|platform", "федератив|контриб", "владени|ownership", "верси|semver|changelog"]
    - id: tech
      title: Техническое решение
      weight: 1.0
      expect: "дизайн-токены, библиотека компонентов в отдельном пакете/монорепо, Storybook/документация, тесты доступности"
      strong: "визуальная регрессия, совместимость с текущими китами (адаптеры), темизация"
      keywords: ["токен", "монорепо|пакет|npm", "storybook|документац", "доступност|a11y|axe", "визуальн\\w* регресс"]
    - id: rollout
      title: План внедрения
      weight: 1.2
      expect: "постепенная миграция: новые экраны — на новой системе, старые — при изменении; приоритет самым используемым компонентам; без заморозки фич"
      strong: "кодмоды/линтеры для миграции, пилот с одной командой"
      keywords: ["постепен|поэтап|инкремент", "нов\\w* экран", "пилот", "codemod|линтер|eslint", "без (заморозк|останов)"]
    - id: metrics
      title: Метрики успеха
      weight: 0.8
      expect: "доля экранов/компонентов на дизайн-системе, время разработки типового экрана, число багов UI/доступности"
      strong: "опрос удовлетворённости разработчиков и дизайнеров, скорость принятия новых версий"
      keywords: ["доля|покрыти|adoption", "время разработк|скорост", "баг", "опрос|удовлетвор"]
  probes:
    - criterion: rollout
      text: "Продакт крупнейшей команды говорит: «Мигрировать не будем, у нас роадмап». Что делаете?"
      expect: "миграция только при изменении экранов, показ выгоды (меньше своего кода), договорённость о доле времени, эскалация с данными при необходимости"
      keywords: ["при изменени|постепен", "выгод|польз", "доля|бюджет", "данн"]
    - criterion: tech
      text: "Как сделать, чтобы обновление дизайн-системы не ломало продукты команд?"
      expect: "семантическое версионирование, changelog, визуальные регрессионные тесты, депрекейты с периодом перехода"
      keywords: ["semver|верси", "регресс", "депрекейт|deprecat|переходн", "changelog"]
    - criterion: metrics
      text: "Через полгода руководство спрашивает, окупилась ли дизайн-система. Что покажете?"
      expect: "доля покрытия, сэкономленное время на типовых задачах, снижение UI-багов и проблем доступности, скорость вывода фич"
      keywords: ["покрыти|доля", "время|скорост", "баг|дефект", "доступност"]
  twist:
    text: "Компания покупает стартап со своим фронтендом на Vue. Как это влияет на ваш план?"
    expect: "фреймворконезависимый слой (токены, CSS, веб-компоненты), отдельная оценка стоимости миграции, не форсировать переписывание"
    keywords: ["токен", "веб.компонент|web component|css", "независим", "не (форсир|переписыв)|отдельн"]

- id: mob.middle.lifecycle
  spec: mobile
  grade: middle
  skill: mobile
  title: Потеря данных и падения при повороте
  params:
    pct: ["0,4", "1,2", "2,5"]
  context: |
    Мобильное приложение заявок. Пользователи жалуются: при повороте экрана или возврате в
    приложение после звонка теряется введённый в форму текст. Crash-free sessions упал до
    {{pct}}% ниже целевого: в отчётах падение `NullPointerException` (Android) /
    обращение к освобождённому экрану (iOS) в колбэке сетевого запроса, который приходит, когда
    пользователь уже ушёл с экрана.
  task: |
    Объясните причины обеих проблем, как исправите и как будете проверять, что исправление работает
    во всех сценариях.
  criteria:
    - id: diagnosis
      title: Причины
      weight: 1.2
      expect: "жизненный цикл: экран пересоздаётся при повороте/процесс убивается в фоне — состояние хранится в самом экране; колбэк держит ссылку на уничтоженный экран"
      strong: "разделены пересоздание конфигурации и смерть процесса (process death)"
      keywords: ["жизненн\\w* цикл|lifecycle", "пересозда|recreat", "process death|смерть процесс|убива", "ссылк|reference|утечк"]
    - id: fix
      title: Исправление
      weight: 1.2
      expect: "состояние во ViewModel + SavedStateHandle/rememberSaveable (или аналоги iOS: state restoration), запросы в lifecycle-aware scope с отменой, слабые ссылки/наблюдение за состоянием вместо прямого колбэка в экран"
      strong: "однонаправленный поток данных (UDF/MVI), идемпотентная отправка формы"
      keywords: ["viewmodel", "savedstate|remembersaveable|onsaveinstancestate|restoration", "scope|lifecycle|viewlifecycleowner|отмен", "weak|слаб", "livedata|flow|stateflow|combine|observ"]
    - id: verify
      title: Проверка
      weight: 0.8
      expect: "сценарии: поворот, «Don't keep activities», убийство процесса через adb/инструменты, тесты на восстановление состояния"
      strong: "мониторинг crash-free и разбивка по версиям после релиза, поэтапный релиз"
      keywords: ["don.t keep|не сохранять действия", "adb|kill|убить процесс", "тест", "crash.free|crashlytics|мониторинг", "поэтапн|staged"]
  probes:
    - criterion: diagnosis
      text: "Чем отличается потеря состояния при повороте от потери после долгого пребывания в фоне?"
      expect: "поворот — пересоздание экрана в том же процессе (ViewModel живёт); фон — система убивает процесс, ViewModel тоже теряется, нужен сохранённый state"
      keywords: ["процесс", "viewmodel", "savedstate|сохран"]
    - criterion: fix
      text: "Почему хранения в ViewModel недостаточно для формы заявки?"
      expect: "ViewModel не переживает смерть процесса; нужно SavedStateHandle/сохранение черновика"
      keywords: ["смерть процесс|process death|убит", "savedstate|черновик|persist|сохран"]
    - criterion: verify
      text: "Как воспроизведёте падение в колбэке на своём устройстве?"
      expect: "медленная сеть/задержка ответа, уход с экрана до ответа, Don't keep activities"
      keywords: ["медленн|задержк|throttl", "уйти|назад|закрыть экран", "don.t keep"]
  twist:
    text: "Заявку нужно отправить, даже если пользователь закрыл приложение сразу после нажатия «Отправить». Что поменяете?"
    expect: "фоновая отправка через WorkManager/BGTaskScheduler, локальная очередь, идемпотентность на сервере"
    keywords: ["workmanager|bgtask|фонов", "очеред", "идемпотент", "повтор"]

- id: mob.senior.offline_sync
  spec: mobile
  grade: senior
  skill: mobile
  title: Офлайн-режим для выездных сотрудников
  params:
    users: [300, 2000, 8000]
  context: |
    Приложение для {{users}} выездных инженеров: они заполняют акты осмотра там, где часто нет связи.
    Сейчас без сети приложение не работает. Один акт могут редактировать двое (инженер и диспетчер
    из веб-интерфейса). Нужно, чтобы работа шла офлайн, а данные не терялись и не перезаписывались.
  task: |
    Спроектируйте офлайн-режим: хранение, синхронизацию, разрешение конфликтов. Назовите основные
    риски и компромиссы.
  criteria:
    - id: storage
      title: Локальные данные
      weight: 0.9
      expect: "локальная БД (Room/Core Data/SQLite) как источник правды для UI, очередь исходящих изменений, миграции схемы"
      strong: "шифрование локальных данных, ограничение объёма и очистка"
      keywords: ["room|core data|sqlite|realm", "источник правды|single source", "очеред|outbox", "миграц", "шифрован"]
    - id: sync
      title: Синхронизация
      weight: 1.2
      expect: "фоновая синхронизация при появлении сети, повторы с backoff, идемпотентные операции (client-generated id), дельты вместо полной выгрузки"
      strong: "порядок операций, частичная синхронизация, учёт батареи и трафика"
      keywords: ["фонов|workmanager|background", "backoff|повтор", "идемпотент|uuid|client.id", "дельт|инкремент|since|курсор", "батаре|трафик"]
    - id: conflicts
      title: Конфликты
      weight: 1.3
      expect: "версии записей (version/updated_at), обнаружение конфликта на сервере, стратегия: слияние по полям, last-write-wins только для безопасных полей, ручное разрешение для критичных"
      strong: "CRDT/операционные изменения для отдельных полей, журнал изменений для аудита"
      keywords: ["верси|version|etag", "конфликт", "last.write|lww", "слиян|merge|по полям", "вручную|ручн|пользователь выбира", "crdt"]
    - id: risks
      title: Риски и компромиссы
      weight: 0.8
      expect: "сложность и стоимость поддержки, рассинхронизация справочников, устаревшие данные на экране, тестирование сетевых сценариев"
      strong: "мониторинг очереди синхронизации и ошибок, механизм принудительного обновления"
      keywords: ["сложност|стоимост", "справочник|устарев", "тестирован", "монитор"]
  probes:
    - criterion: conflicts
      text: "Инженер и диспетчер офлайн изменили одно и то же поле акта. Что увидит каждый после синхронизации?"
      expect: "сервер обнаруживает конфликт по версии, применяет выбранную стратегию; для критичного поля — пометка конфликта и выбор пользователя, ничьи изменения не теряются молча"
      keywords: ["верси", "конфликт", "выбор|вручную|пометк", "не теря|сохран"]
    - criterion: sync
      text: "Синхронизация прервалась посередине отправки 40 изменений. Как избежите дублей и потерь?"
      expect: "идемпотентные операции с клиентскими id, подтверждение по каждой операции, повтор только неподтверждённых"
      keywords: ["идемпотент|client.id|uuid", "подтвержд|ack", "повтор"]
    - criterion: storage
      text: "Как будете обновлять схему локальной БД, если у части пользователей неделю не было сети?"
      expect: "последовательные миграции схемы, совместимость формата очереди, сервер принимает старые версии API"
      keywords: ["миграц", "совместим|верси\\w* api", "очеред"]
  twist:
    text: "К акту нужно прикладывать фото по 5–10 МБ. Как это меняет решение?"
    expect: "отдельная очередь для файлов, загрузка по частям с возобновлением, сжатие, приоритет метаданных над файлами, загрузка по Wi-Fi"
    keywords: ["отдельн\\w* очеред", "част|chunk|возобнов|resum", "сжат", "wi.fi"]

- id: mob.lead.cross_platform
  spec: mobile
  grade: lead
  skill: architecture
  title: Нативно или кроссплатформенно
  params:
    ios: [3, 5]
    android: [3, 4]
  context: |
    У компании два нативных приложения: iOS ({{ios}} разработчика) и Android ({{android}}). Функциональность
    расходится: новые фичи выходят на платформах с разницей в 1–2 месяца. Бизнес хочет паритет и
    скорость и спрашивает, не перейти ли на Flutter или Kotlin Multiplatform.
  task: |
    Как вы подготовите решение? Какие варианты рассмотрите, по каким критериям сравните, какой план
    перехода (или отказа от него) предложите и как это скажется на команде?
  criteria:
    - id: diagnosis
      title: Причина расхождения
      weight: 1.0
      expect: "проверено, в чём реальная причина: разные бэклоги и приоритеты, неравные команды, процесс, а не только технология"
      strong: "данные о сроках по фичам, доля общей бизнес-логики"
      keywords: ["бэклог|приоритет|процесс", "причин", "данн|измер", "общ\\w* логик"]
    - id: options
      title: Варианты
      weight: 1.3
      expect: "сравнены: синхронизация процессов в натив, KMP (общая логика, нативный UI), Flutter/React Native (общий UI); критерии — производительность, нативные API, найм, стоимость миграции, риск"
      strong: "пилот на одной фиче, оценка общей доли кода"
      keywords: ["kmp|multiplatform", "flutter|react native", "нативн\\w* ui|натив", "найм|рынок", "пилот"]
    - id: plan
      title: План
      weight: 1.0
      expect: "поэтапный переход или пилот с критериями успеха и точкой принятия решения"
      strong: "план отката, сроки и метрики (время до выпуска фичи на обеих платформах)"
      keywords: ["пилот|этап", "критери", "откат", "метрик|срок"]
    - id: people
      title: Команда
      weight: 0.9
      expect: "влияние на разработчиков: переобучение, риск ухода, роли; коммуникация решения"
      strong: "смешанные кросс-платформенные фича-команды"
      keywords: ["обучен|переобуч", "уход|удержан|мотивац", "команд", "коммуникац"]
  probes:
    - criterion: options
      text: "Когда бы вы НЕ стали переходить на Flutter?"
      expect: "сильная зависимость от нативных API/производительности, сильные нативные команды, высокая стоимость переписывания при невысокой выгоде"
      keywords: ["нативн\\w* api|производительн", "стоимост|переписыв", "команд"]
    - criterion: plan
      text: "Как будет выглядеть пилот и что должно получиться, чтобы вы продолжили?"
      expect: "одна фича/модуль, срок, метрики (время разработки, баги, производительность), заранее оговорённый порог решения"
      keywords: ["одн\\w* фич|модул", "срок", "метрик", "порог|критери"]
    - criterion: people
      text: "iOS-разработчики говорят, что уйдут, если перейдёте на Flutter. Ваши действия?"
      expect: "обсудить опасения, рассмотреть KMP с нативным UI, сохранить нативные роли, учесть риск в решении"
      keywords: ["kmp|натив", "опасени|обсуд|поговор", "риск"]
  twist:
    text: "Через месяц появится требование: офлайн-режим и сложная анимированная графика. Повлияет ли это на выбор?"
    expect: "да: общая логика (офлайн, синхронизация) — сильная сторона KMP; сложный UI/графика — аргумент за натив или за проверку Flutter на пилоте"
    keywords: ["kmp|общ\\w* логик", "натив|графи", "пилот|провер"]

- id: ds.middle.churn_accuracy
  spec: data_science
  grade: middle
  skill: ml
  title: Модель оттока с точностью 97%
  params:
    rate: [3, 5, 8]
  derived:
    rate_comp: "100 - rate"
  context: |
    Коллега обучил модель оттока клиентов банка и докладывает: accuracy на тесте — 97%. В данных
    {{rate}}% ушедших клиентов. Признаки: возраст, баланс, число продуктов, обращения в поддержку
    за месяц, дата закрытия последнего договора. Разбиение — случайное 80/20 по строкам; у одного
    клиента несколько строк (помесячные снимки).
  task: |
    Можно ли доверять этому результату? Перечислите проблемы, предложите правильную постановку
    оценки и что изменить в модели.
  criteria:
    - id: metrics
      title: Метрика
      weight: 1.1
      expect: "accuracy неинформативна при дисбалансе (константа «не уйдёт» даёт ~{{rate_comp}}%), нужны precision/recall, PR-AUC, F1, подбор порога"
      strong: "метрика, связанная с бизнесом (стоимость удержания и потерь, lift в топ-k)"
      keywords: ["дисбаланс|несбаланс", "precision|recall|полнот|точност", "pr.auc|roc.auc|f1", "порог|threshold", "lift|стоимост|бизнес"]
    - id: leakage
      title: Утечки
      weight: 1.3
      expect: "утечка целевой переменной: дата закрытия договора известна только после ухода; утечка через снимки одного клиента в train и test"
      strong: "проверка признаков на доступность в момент прогноза, анализ важности признаков для поиска утечек"
      keywords: ["утечк|leak", "дата закрыт", "один\\w* клиент|групп|groupkfold", "момент прогноз|будущ"]
    - id: validation
      title: Валидация
      weight: 1.0
      expect: "разбиение по клиентам (GroupKFold) и по времени (обучение на прошлом, тест на будущем), стратификация"
      strong: "отложенная выборка по последнему периоду, доверительные интервалы метрик"
      keywords: ["groupkfold|по клиент", "по времен|time.?series|временн", "стратиф", "отложенн|holdout"]
  probes:
    - criterion: metrics
      text: "Какую accuracy получит модель, которая всем предсказывает «не уйдёт», и что из этого следует?"
      expect: "около {{rate_comp}}% — то есть 97% почти не лучше константы"
      keywords: ["{{rate_comp}}", "констант|всегда|все", "не лучше|почти|бесполез"]
    - criterion: leakage
      text: "Как вы будете систематически проверять признаки на утечку, а не только этот?"
      expect: "для каждого признака — известен ли он на момент прогноза; подозрительно важные признаки; модель только на одном признаке"
      keywords: ["момент прогноз|на дату|известен", "важност|importance", "подозрит|слишком"]
    - criterion: validation
      text: "Почему случайное разбиение по строкам здесь завышает качество?"
      expect: "снимки одного клиента попадают в train и test — модель запоминает клиента; плюс смешивается будущее с прошлым"
      keywords: ["один\\w* клиент|снимк", "запомина|memoriz", "будущ"]
  twist:
    text: "Бизнес может позвонить только 500 клиентам в месяц. Как это меняет выбор метрики и порога?"
    expect: "оптимизировать precision/lift в топ-500, порог выбирается по ёмкости, оценивать uplift от звонка"
    keywords: ["топ|top.k|500", "precision|lift", "uplift|эффект звонк", "порог"]

- id: ds.senior.drift
  spec: data_science
  grade: senior
  skill: ml
  title: Модель деградировала в продакшене
  params:
    drop: [8, 15, 25]
  context: |
    Модель кредитного скоринга работает в продакшене 4 месяца. Финансовый отдел сообщает, что доля
    дефолтов среди одобренных выросла на {{drop}}% относительно ожидаемой. Метки «дефолт» появляются
    только через 90 дней после выдачи. Месяц назад партнёр сменил формат анкеты, а маркетинг
    запустил рекламу на новую аудиторию.
  task: |
    Как вы будете разбираться, что произошло? Что нужно было мониторить заранее и какие действия
    предпримете сейчас и в долгую?
  criteria:
    - id: diagnosis
      title: Разбор причин
      weight: 1.2
      expect: "разделены гипотезы: сломанный пайплайн/формат признаков, сдвиг аудитории (data drift), изменение зависимости (concept drift); проверка по сегментам и источникам"
      strong: "сравнение распределений до/после смены анкеты, проверка что модель видит те же признаки, что и на обучении (training-serving skew)"
      keywords: ["data drift|сдвиг данных|распределени", "concept drift|концепт", "пайплайн|формат|skew", "сегмент|источник|канал"]
    - id: monitoring
      title: Мониторинг
      weight: 1.1
      expect: "мониторинг входных признаков (PSI, доли пропусков, диапазоны), распределения скоров, прокси-метрики до появления меток (ранние просрочки)"
      strong: "алерты с порогами, мониторинг по сегментам, контроль качества данных на входе"
      keywords: ["psi|kl|wasserstein|ks", "пропуск|null", "распределени\\w* скор", "прокси|ранн\\w* просроч|первый платёж", "алерт"]
    - id: actions
      title: Действия
      weight: 1.0
      expect: "немедленно: исправить пайплайн/откатиться на правила или прошлую модель, ужесточить порог для нового сегмента; в долгую: переобучение, champion/challenger"
      strong: "оценка финансового эффекта каждого действия, согласование с риск-менеджментом"
      keywords: ["откат|rollback|прошл\\w* модел", "порог", "переобуч|retrain", "champion|challenger|a/b", "риск"]
  probes:
    - criterion: diagnosis
      text: "Как отличить поломку пайплайна после смены анкеты от реального изменения аудитории?"
      expect: "сравнить распределения признаков по источнику до/после смены формата, проверить пропуски и кодировки, прогнать сырые анкеты через пайплайн обучения"
      keywords: ["распределени", "источник|партнёр", "пропуск|кодировк", "до.*после"]
    - criterion: monitoring
      text: "Метки появляются через 90 дней. Что вы мониторите в первые недели после выдачи?"
      expect: "дрейф признаков и скоров, ранние сигналы (пропуск первого платежа), качество данных"
      keywords: ["дрейф|psi|распределени", "первый платёж|ранн", "скор"]
    - criterion: actions
      text: "Бизнес не хочет откатывать модель, потому что одобрения упадут. Ваш аргумент?"
      expect: "сравнение потерь от дефолтов и упущенной выручки в деньгах, частичные меры для проблемного сегмента"
      keywords: ["потер|деньг|убыт", "сегмент", "компромисс|частичн"]
  twist:
    text: "Регулятор требует объяснять клиенту причину отказа. Как это повлияет на выбор модели и мониторинг?"
    expect: "интерпретируемость (скоркарта/монотонные ограничения/SHAP), стабильность объяснений, документирование"
    keywords: ["интерпрет|объясн", "shap|скоркарт|монотон", "документ"]

- id: ds.lead.ml_roadmap
  spec: data_science
  grade: lead
  skill: ml
  title: Три запроса на ML и четыре человека
  params:
    people: [4, 6]
  context: |
    Вы руководите DS-командой из {{people}} человек. Пришли три запроса: (1) рекомендации товаров на
    сайте, (2) прогноз спроса для закупок, (3) чат-бот поддержки на LLM. У каждого заказчика —
    «срочно и важно». Инфраструктуры для выкладки моделей нет, модели сейчас живут в ноутбуках.
  task: |
    Как вы приоритизируете запросы, что пообещаете заказчикам и как выстроите работу команды, чтобы
    модели доходили до продакшена?
  criteria:
    - id: value
      title: Оценка ценности
      weight: 1.2
      expect: "оценка эффекта в деньгах/метриках бизнеса, наличия данных и сложности для каждого запроса, сравнение с простым бейзлайном без ML"
      strong: "формулировка измеримого критерия успеха с каждым заказчиком"
      keywords: ["эффект|деньг|выручк|roi", "данн", "бейзлайн|baseline|эвристик|правил", "критери\\w* успех|метрик"]
    - id: priority
      title: Приоритизация и обещания
      weight: 1.0
      expect: "явная приоритизация с обоснованием, поэтапные обещания (MVP/пилот со сроком), прозрачность для всех заказчиков"
      strong: "вынос решения на уровень руководства при конфликте приоритетов"
      keywords: ["приоритет", "mvp|пилот|этап", "срок", "прозрачн|руководств"]
    - id: mlops
      title: Путь в продакшен
      weight: 1.1
      expect: "минимальная MLOps-основа: воспроизводимое обучение, версионирование данных/моделей, выкладка и мониторинг; совместная работа с инженерами"
      strong: "переиспользуемая платформа под несколько моделей, оценка build vs buy"
      keywords: ["mlops|mlflow|dvc", "верси", "мониторинг", "выкладк|деплой|сервинг", "build.vs.buy|готов\\w* решени"]
    - id: team
      title: Команда
      weight: 0.8
      expect: "распределение людей и ролей, развитие компетенций, защита от выгорания при трёх срочных проектах"
      strong: "найм/привлечение инженеров данных, ротация"
      keywords: ["рол|распредел", "компетенц|развит", "выгоран|нагрузк", "найм|инженер\\w* данных"]
  probes:
    - criterion: value
      text: "Какой запрос возьмёте первым и какие цифры для этого решения вам нужны?"
      expect: "выбор с опорой на эффект, данные и риск; конкретные цифры (оборот, потери от неверных закупок, нагрузка на поддержку)"
      keywords: ["эффект|оборот|потер", "данн", "риск"]
    - criterion: mlops
      text: "Почему не начать сразу с моделей, а не с инфраструктуры?"
      expect: "можно начать с модели, но заложить минимальную инфраструктуру по ходу; без пути в прод ценность нулевая"
      keywords: ["минимальн|по ходу|параллельн", "прод|ценност"]
    - criterion: priority
      text: "Заказчик чат-бота идёт к CEO и требует начать с него. Ваши действия?"
      expect: "прозрачное сравнение по общим критериям, предложение быстрого пилота или готового решения, решение на уровне руководства"
      keywords: ["критери|сравнени", "пилот|готов", "руководств|ceo"]
  twist:
    text: "Выяснилось, что данные о продажах за прошлый год потеряны наполовину. Что поменяется?"
    expect: "пересмотр прогноза спроса (риск качества), сбор данных как задача, смена приоритетов"
    keywords: ["пересмотр|приоритет", "сбор данных|данн", "риск|качеств"]

- id: qa.middle.promo_code
  spec: qa
  grade: middle
  skill: testing
  title: Тест-дизайн промокода
  params:
    min: [1000, 2500, 5000]
    pct: [10, 15, 20]
  derived:
    min_minus: "min - 1"
  context: |
    В корзине появилось поле «Промокод». Требования: код — от 6 до 10 латинских букв и цифр;
    даёт скидку {{pct}}% на заказ от {{min}} ₽ (до скидки); один промокод на пользователя; у кода есть
    дата окончания действия; скидка не суммируется с другими акциями.
  task: |
    Составьте набор проверок (не обязательно все кейсы целиком — важны идеи и приоритеты), найдите
    неясности в требованиях и укажите, какие баги вы считаете наиболее критичными.
  criteria:
    - id: design
      title: Классы и границы
      weight: 1.2
      expect: "классы эквивалентности и граничные значения: длина 5/6/10/11, недопустимые символы, сумма {{min_minus}}/{{min}}, регистр"
      strong: "граница даты окончания (последний день, часовой пояс), пробелы по краям"
      keywords: ["граничн|границ", "класс\\w* эквивалент", "5.*6|10.*11|длин", "{{min}}", "регистр|пробел|символ"]
    - id: negative
      title: Негативные и состояния
      weight: 1.0
      expect: "повторное применение, истёкший код, удаление товаров после применения (сумма упала ниже порога), сочетание с акцией, применение двумя вкладками/устройствами одновременно"
      strong: "отмена заказа и возврат — восстанавливается ли код, безопасность (перебор кодов)"
      keywords: ["повтор|дважды", "истёк|истек|просроч", "удал\\w* товар|ниже порог|пересчёт", "акци", "одновремен|две вкладк|два устройств", "перебор|brute"]
    - id: gaps
      title: Неясности требований
      weight: 1.0
      expect: "вопросы: считается ли доставка в сумму, «один на пользователя» — навсегда или на заказ, что при отмене заказа, как округлять скидку, часовой пояс окончания"
      strong: "предложено зафиксировать ответы в требованиях/критериях приёмки"
      keywords: ["доставк", "отмен", "округл", "часов\\w* пояс", "вопрос|уточн|неясн"]
    - id: priority
      title: Приоритеты
      weight: 0.8
      expect: "критичные — денежные: скидка без выполнения условий, повторное использование, неверный расчёт; затем UX-ошибки"
      strong: "связь приоритета с риском потерь и частотой сценария"
      keywords: ["критич|приоритет|severity", "деньг|потер|финанс", "расчёт|сумм"]
  probes:
    - criterion: design
      text: "Назовите конкретные значения суммы заказа, которые вы проверите, и почему именно их."
      expect: "{{min_minus}}, {{min}} и чуть выше — граница «от {{min}}» включительно; плюс копейки/округление"
      keywords: ["{{min_minus}}", "{{min}}", "включ|границ"]
    - criterion: negative
      text: "Пользователь применил код, а потом удалил часть товаров, и сумма стала ниже порога. Что должно происходить и как это проверить?"
      expect: "скидка должна сниматься с сообщением; проверить пересчёт в корзине и на сервере при оформлении"
      keywords: ["снима|отмен|пересч", "сообщени|уведом", "сервер|оформлен"]
    - criterion: gaps
      text: "Какой один вопрос аналитику вы зададите первым и почему?"
      expect: "вопрос о правиле с наибольшим финансовым риском или неоднозначностью (сумма с доставкой/без, «один на пользователя»)"
      keywords: ["доставк|один на пользовател|отмен", "риск|деньг|неоднознач"]
  twist:
    text: "Теперь промокод можно сочетать с акцией «1+1». Какие новые проверки появятся?"
    expect: "порядок применения скидок, расчёт от суммы до/после акции, бесплатный товар и порог, максимальная скидка"
    keywords: ["порядок", "до.*после|от суммы", "бесплатн|1\\+1", "максимальн|предел"]

- id: qa.senior.flaky_e2e
  spec: qa
  grade: senior
  skill: testing
  title: Нестабильные e2e-тесты блокируют релизы
  params:
    flaky: [12, 20, 35]
    tests: [400, 900]
  context: |
    В проекте {{tests}} end-to-end тестов (Selenium), прогон занимает 2 часа, {{flaky}}% прогонов падают
    «случайно» — при перезапуске проходят. Разработчики перестали смотреть на красный CI и
    перезапускают до зелёного. Релиз раз в неделю, на прошлой неделе в прод ушёл реальный баг,
    который тест ловил, но его падение приняли за «флак».
  task: |
    Как вы вернёте доверие к автотестам? Опишите диагностику, технические меры и изменения в
    стратегии тестирования, а также как будете измерять прогресс.
  criteria:
    - id: diagnosis
      title: Диагностика
      weight: 1.0
      expect: "сбор статистики нестабильности по тестам, классификация причин: ожидания/тайминги, общие тестовые данные, зависимость от порядка, окружение, реальные баги"
      strong: "артефакты падений (скриншоты, логи, видео) и ретест для выявления флаков автоматически"
      keywords: ["статистик|по тест", "ожидани|wait|тайминг|sleep", "тестов\\w* данн|изоляц", "порядк|зависим", "окружени|стенд"]
    - id: fixes
      title: Технические меры
      weight: 1.1
      expect: "явные ожидания вместо sleep, изоляция тестовых данных, независимость тестов, карантин нестабильных с владельцем и сроком, параллелизация"
      strong: "стабильные локаторы (data-testid), моки внешних сервисов"
      keywords: ["явн\\w* ожидан|explicit|waitfor", "изоляц|фикстур|своих данн", "карантин|quarantine", "параллел", "data.testid|локатор", "мок|mock|stub"]
    - id: strategy
      title: Стратегия
      weight: 1.2
      expect: "пирамида тестирования: перенос проверок на уровень API/контрактов/компонентов, e2e — только ключевые сценарии; правило «красный CI блокирует»"
      strong: "контрактные тесты между сервисами, smoke-набор на каждый коммит"
      keywords: ["пирамид", "api|контракт|компонент|unit|модульн", "ключев\\w* сценари|smoke", "блокир"]
    - id: metrics
      title: Метрики прогресса
      weight: 0.8
      expect: "доля нестабильных прогонов, время прогона, число пропущенных в прод дефектов, время до зелёной сборки"
      strong: "целевые значения и регулярный разбор"
      keywords: ["дол\\w* нестабильн|flaky rate", "время прогон", "пропущенн|в прод", "цел"]
  probes:
    - criterion: fixes
      text: "Что такое карантин для теста и как не превратить его в свалку отключённых тестов?"
      expect: "временное исключение из блокирующего прогона с владельцем, сроком и задачей; лимит размера карантина, регулярный разбор"
      keywords: ["владел|ответствен", "срок", "лимит|разбор|регулярн"]
    - criterion: strategy
      text: "Какие из 900 e2e-проверок вы оставите на уровне e2e и по какому принципу?"
      expect: "критичные пользовательские сценарии и сквозные интеграции; остальное — на API/компонентном уровне"
      keywords: ["критичн|ключев", "сквозн|интеграц", "api|компонент"]
    - criterion: diagnosis
      text: "Как отличить флак от реального бага, который проявляется не всегда?"
      expect: "анализ артефактов и логов, воспроизведение с теми же данными, статистика по коду/коммитам, гонки в продукте тоже бывают"
      keywords: ["лог|артефакт|скриншот", "воспроизв", "гонк|нестабильн\\w* продукт"]
  twist:
    text: "Компания переходит на ежедневные релизы. Что из вашего плана становится обязательным в первую очередь?"
    expect: "быстрый стабильный smoke-набор, блокирующий CI, контрактные/API-тесты, мониторинг и откат в проде"
    keywords: ["smoke|быстр", "блокир", "api|контракт", "мониторинг|откат"]

- id: qa.lead.qa_strategy
  spec: qa
  grade: lead
  skill: testing
  title: QA-стратегия для ежедневных релизов
  params:
    days: [3, 5]
  context: |
    Вы возглавляете QA (6 тестировщиков на 5 продуктовых команд). Сейчас перед каждым релизом —
    ручной регресс на {{days}} дня, релиз раз в две недели. Компания хочет релизиться ежедневно.
    Автотестов мало, тестировщики сидят отдельной командой и получают сборки «на проверку».
  task: |
    Предложите новую модель качества: роли и процессы, техническую стратегию тестирования, план
    перехода и метрики. Что будет с людьми?
  criteria:
    - id: model
      title: Модель качества
      weight: 1.2
      expect: "качество — ответственность команды: QA внутри продуктовых команд, тестирование на ранних этапах (shift-left), разработчики пишут автотесты"
      strong: "роль QA как тренера/консультанта качества, тестирование в проде (feature flags, canary)"
      keywords: ["внутри команд|в команд", "shift.left|раньше|на ранн", "разработчик\\w* пиш", "feature.flag|canary|в проде"]
    - id: tech
      title: Техническая стратегия
      weight: 1.0
      expect: "пирамида автотестов, регресс в CI, приоритизация автоматизации по риску, тестовые окружения/данные"
      strong: "контрактные тесты, мониторинг и быстрый откат как часть качества"
      keywords: ["пирамид", "ci|автоматиз", "риск", "окружени|тестов\\w* данн", "контракт|мониторинг|откат"]
    - id: plan
      title: План перехода
      weight: 1.0
      expect: "поэтапно: сокращение регресса за счёт автоматизации критичных сценариев, пилотная команда, промежуточные цели (еженедельно → ежедневно)"
      strong: "критерии готовности к ежедневным релизам"
      keywords: ["поэтап|этап", "пилот", "критичн", "еженедельн|промежуточн|критери"]
    - id: people
      title: Люди
      weight: 0.8
      expect: "переобучение ручных тестировщиков (автоматизация, исследовательское тестирование), карьерные треки, прозрачная коммуникация изменений"
      strong: "индивидуальные планы развития, учёт рисков ухода ключевых людей"
      keywords: ["обучен|переобуч", "карьер|трек|развит", "коммуникац|прозрачн", "исследовательск"]
  probes:
    - criterion: plan
      text: "Какие условия должны выполниться, прежде чем вы согласитесь на ежедневные релизы?"
      expect: "автоматический регресс критичных сценариев в CI, время прогона, стабильность тестов, мониторинг и откат"
      keywords: ["автоматическ|ci", "стабильн", "мониторинг|откат", "критичн"]
    - criterion: model
      text: "Разработчики говорят: «Тестировать — работа QA». Как будете менять это?"
      expect: "договорённость на уровне руководства, определение готовности (DoD) с тестами, поддержка и обучение, метрики качества у команды"
      keywords: ["dod|определени\\w* готов", "руководств|договор", "обучен|поддерж", "метрик"]
    - criterion: people
      text: "Двое опытных ручных тестировщиков не хотят учиться автоматизации. Что им предложите?"
      expect: "роли исследовательского тестирования, экспертизы домена, приёмки; честный разговор о будущем роли"
      keywords: ["исследовательск|домен|приёмк", "разговор|честн", "рол"]
  twist:
    text: "Через месяц крупный клиент требует сертификацию с полной документацией тестирования. Как совместить с вашим планом?"
    expect: "трассируемость требований к тестам, автоматически генерируемые отчёты из CI, минимальная достаточная документация"
    keywords: ["трассир|traceab", "отчёт|ci", "документац"]

- id: ops.middle.crashloop
  spec: devops
  grade: middle
  skill: kubernetes
  title: CrashLoopBackOff после деплоя
  params:
    replicas: [3, 6, 10]
  context: |
    После деплоя новой версии сервиса все {{replicas}} подов в статусе `CrashLoopBackOff`, старая версия
    уже удалена (стратегия Recreate). В логах контейнера последние строки:
    `connecting to postgres at db:5432 ... connection refused` и `exit code 1`. В этом же релизе
    поменяли Helm-чарт: переименовали Service базы и добавили liveness-пробу с `initialDelaySeconds: 2`.
  task: |
    Опишите по шагам, как будете разбираться, какие гипотезы проверите, как быстро восстановите
    работу и что поменяете, чтобы это не повторилось.
  criteria:
    - id: steps
      title: Диагностика
      weight: 1.1
      expect: "kubectl describe pod/events, logs --previous, причина рестарта (exit code, OOMKilled), проверка Service/Endpoints и DNS-имени, переменных окружения/секретов"
      strong: "проверка из отладочного пода (nslookup/nc), сравнение чартов через helm diff"
      keywords: ["describe", "logs.*previous|--previous|предыдущ", "event|событи", "endpoint|service|dns|nslookup", "env|секрет|переменн", "helm diff|diff"]
    - id: hypotheses
      title: Гипотезы
      weight: 1.1
      expect: "старое имя Service в конфиге приложения (connection refused/неверный хост), слишком ранняя liveness-проба убивает контейнер до старта, нет повторов подключения к БД"
      strong: "различение liveness и readiness, startupProbe"
      keywords: ["переимен|имя service|старое имя", "liveness|initialdelay", "readiness|startupprobe", "повтор\\w* подключ|retry"]
    - id: recovery
      title: Восстановление
      weight: 1.0
      expect: "быстрый откат: helm rollback к прошлой ревизии, затем исправление и повторный выкат"
      strong: "коммуникация об инциденте, проверка данных/миграций при откате"
      keywords: ["rollback|откат", "ревизи|предыдущ\\w* верси", "коммуникац|инцидент", "миграц"]
    - id: prevention
      title: Предотвращение
      weight: 0.8
      expect: "RollingUpdate вместо Recreate, readiness/startup-пробы, проверка на стейдже, повторы подключения в приложении"
      strong: "PodDisruptionBudget, автоматический откат по метрикам, линтинг чартов"
      keywords: ["rollingupdate|rolling", "readiness|startup", "стейдж|staging", "pdb|disruption", "автоматическ\\w* откат|canary"]
  probes:
    - criterion: hypotheses
      text: "Чем отличаются liveness, readiness и startup-пробы, и какая из них виновата здесь?"
      expect: "liveness перезапускает контейнер, readiness убирает из балансировки, startup откладывает остальные пробы; ранняя liveness убивает ещё не стартовавший контейнер"
      keywords: ["перезапус", "балансиров|трафик", "startup", "ранн|initialdelay"]
    - criterion: recovery
      text: "helm rollback выполнен, но поды старой версии тоже не стартуют. Что дальше?"
      expect: "проверить, что изменилось вне чарта (Service/секреты/БД, миграции), состояние БД, events"
      keywords: ["вне чарт|секрет|service", "миграц|бд|база", "event|describe"]
    - criterion: prevention
      text: "Почему стратегия Recreate усугубила инцидент?"
      expect: "старые поды удалены до старта новых — нет работающих реплик; RollingUpdate оставил бы старые при неготовых новых"
      keywords: ["удален|остановлен", "rolling", "готов|readiness"]
  twist:
    text: "Такой деплой нужно делать 20 раз в день. Что автоматизируете в первую очередь?"
    expect: "прогрессивную доставку с автоматическим откатом по метрикам, проверки чартов в CI, smoke-тесты после деплоя"
    keywords: ["автоматическ\\w* откат|canary|прогрессивн", "ci|линт", "smoke"]

- id: ops.senior.night_latency
  spec: devops
  grade: senior
  skill: linux
  title: Ночные всплески задержек и усталость от алертов
  params:
    p99: [2, 4, 9]
    alerts: [40, 120]
  context: |
    Каждую ночь около 03:00 p99 задержки API вырастает до {{p99}} с на 15–20 минут. Дежурные получают
    около {{alerts}} алертов в неделю, большинство закрывают без действий; на прошлой неделе
    пропустили реальный инцидент среди шума. В 03:00 по cron запускаются бэкап БД и пересчёт отчётов,
    на тех же узлах крутится сервис логов.
  task: |
    Как вы найдёте причину всплесков и как перестроите алертинг, чтобы дежурные реагировали только на
    то, что важно?
  criteria:
    - id: investigation
      title: Расследование
      weight: 1.1
      expect: "корреляция по времени с cron-задачами, метрики узлов (CPU, I/O wait, диск, сеть), трассировки медленных запросов, блокировки в БД"
      strong: "эксперимент: перенос задачи и наблюдение эффекта, разбор по слоям (USE/RED)"
      keywords: ["корреляц|cron|по времен", "iowait|i/o|диск", "трассир|trace", "блокировк|lock", "use|red|эксперимент|перенес"]
    - id: fix
      title: Устранение
      weight: 0.9
      expect: "бэкап с реплики, ограничение ресурсов (ionice/cgroups/лимиты), перенос отчётов, разведение по узлам"
      strong: "оценка компромисса RPO/времени бэкапа"
      keywords: ["реплик", "ionice|nice|cgroup|лимит", "перенос|развест|отдельн\\w* узл", "rpo"]
    - id: alerting
      title: Алертинг
      weight: 1.3
      expect: "алерты на симптомы пользователя по SLO (error budget, burn rate), а не на каждую причину; каждый алерт действуемый с runbook; разбор и удаление шумных"
      strong: "уровни важности (page vs ticket), регулярный обзор алертов"
      keywords: ["slo|sli", "burn rate|error budget|бюджет ошибок", "симптом", "runbook|действ", "page|ticket|важност"]
    - id: process
      title: Процесс
      weight: 0.7
      expect: "постмортем пропущенного инцидента без поиска виноватых, метрики нагрузки на дежурных"
      strong: "ротация и компенсация дежурств"
      keywords: ["постмортем|postmortem|blameless", "дежурн", "нагрузк|метрик"]
  probes:
    - criterion: investigation
      text: "Как вы докажете, что виноват именно бэкап, а не пересчёт отчётов?"
      expect: "развести задачи по времени/выключить одну, сравнить метрики I/O и задержек, профиль узлов"
      keywords: ["развест|по очеред|выключ|перенес", "метрик|i/o|iowait", "сравн"]
    - criterion: alerting
      text: "Что такое burn rate и как он поможет сократить число алертов?"
      expect: "скорость расходования бюджета ошибок SLO; алерт только при быстром/устойчивом расходовании, а не на каждый всплеск"
      keywords: ["бюджет|budget", "скорост|быстр|расход", "slo"]
    - criterion: process
      text: "Как не допустить, чтобы через полгода алертов снова стало слишком много?"
      expect: "регулярный обзор алертов, правило «у каждого алерта владелец и runbook», метрика шума"
      keywords: ["регулярн|обзор", "владел|runbook", "метрик|шум"]
  twist:
    text: "Бизнес выходит на рынок другого часового пояса, и 03:00 становится пиком трафика. Ваш план?"
    expect: "перенос тяжёлых задач на реплики/отдельные ресурсы, задачи без влияния на прод, переоценка окна обслуживания"
    keywords: ["реплик|отдельн", "окн|перенос", "прод"]

- id: ops.lead.k8s_migration
  spec: devops
  grade: lead
  skill: kubernetes
  title: Переезд на Kubernetes
  params:
    services: [15, 40]
  context: |
    {{services}} сервисов работают на виртуальных машинах, деплой — Ansible, команда платформы —
    3 человека. Разработчики жалуются на долгий вывод новых сервисов (2 недели на ВМ и доступы).
    Руководство спрашивает: переезжаем на Kubernetes или нет, сколько это стоит и когда будет польза?
  task: |
    Подготовьте позицию для руководства: варианты, стоимость и риски, план и критерии успеха.
  criteria:
    - id: problem
      title: Постановка
      weight: 1.0
      expect: "сначала цель и узкие места (время вывода сервиса, ручные операции), Kubernetes — одно из средств"
      strong: "данные о текущем lead time, инцидентах, утилизации"
      keywords: ["цель|проблем|узк", "lead time|время вывод", "данн|метрик", "средств"]
    - id: options
      title: Варианты и стоимость
      weight: 1.3
      expect: "сравнение: улучшить автоматизацию на ВМ (шаблоны, self-service), managed Kubernetes в облаке, свой кластер; стоимость владения, нагрузка на команду из 3 человек, обучение, риски"
      strong: "PaaS/внутренняя платформа как продукт для разработчиков"
      keywords: ["managed|облак", "свой кластер|self.hosted|on.prem", "стоимост\\w* владени|tco", "обучен|компетенц", "self.service|платформ"]
    - id: plan
      title: План
      weight: 1.0
      expect: "пилот на нескольких некритичных сервисах, поэтапная миграция, критерии успеха и точка решения"
      strong: "стандартизация (шаблоны чартов, CI), план отката"
      keywords: ["пилот", "поэтап|этап", "критери", "шаблон|стандарт", "откат"]
    - id: org
      title: Организация
      weight: 0.8
      expect: "ресурсы команды (найм/обучение), зоны ответственности платформы и продуктовых команд, коммуникация"
      strong: "SLA платформы для разработчиков"
      keywords: ["найм|обучен", "ответствен|владени", "коммуникац", "sla"]
  probes:
    - criterion: options
      text: "Когда переезд на Kubernetes будет ошибкой для этой компании?"
      expect: "если узкое место в процессах/доступах, а не в оркестрации; если команде не хватает ресурсов поддерживать кластер; если сервисов мало"
      keywords: ["процесс|доступ", "ресурс|команд\\w* из 3|поддерж", "мало"]
    - criterion: plan
      text: "Какой будет первый шаг на ближайший месяц и какой результат вы покажете?"
      expect: "конкретный шаг (пилот/шаблон self-service) с измеримым результатом, например время вывода сервиса"
      keywords: ["пилот|шаблон|self.service", "время|измер|метрик"]
    - criterion: org
      text: "Команда платформы говорит, что не потянет поддержку кластера. Как решите?"
      expect: "managed-решение, найм, приоритизация задач платформы, отказ от части работ"
      keywords: ["managed", "найм", "приоритет|отказ"]
  twist:
    text: "Требование безопасности: данные клиентов только в контуре РФ и с сертифицированными средствами защиты. Что меняется?"
    expect: "выбор российского облака/он-прем с сертификацией, влияние на стоимость и сроки, политика доступа и аудит"
    keywords: ["российск|контур рф|152|сертифиц", "стоимост|срок", "аудит|доступ"]

- id: an.middle.order_cancel
  spec: analyst
  grade: middle
  skill: requirements
  title: Требования к отмене заказа
  params:
    hours: [1, 2, 24]
  context: |
    Продакт просит: «Нужна отмена заказа клиентом в приложении в течение {{hours}} ч после оформления».
    Заказ проходит этапы: оформлен → оплачен → собирается на складе → передан в доставку. Оплата —
    картой или при получении. Есть программа лояльности: за заказ начисляются баллы, ими можно
    оплатить до 30% заказа.
  task: |
    Какие вопросы вы зададите и кому? Напишите пользовательскую историю и критерии приёмки, перечислите
    затрагиваемые системы и крайние случаи.
  criteria:
    - id: questions
      title: Вопросы и стейкхолдеры
      weight: 1.0
      expect: "вопросы о доступности отмены на каждом этапе, частичной отмене, возврате денег и баллов, причинах отмены; стейкхолдеры: склад, финансы, поддержка, лояльность"
      strong: "цель фичи и метрика успеха (снижение нагрузки на поддержку?)"
      keywords: ["этап|статус", "частичн", "возврат", "балл", "склад|финанс|поддержк", "цель|метрик"]
    - id: acceptance
      title: История и критерии приёмки
      weight: 1.2
      expect: "история «Как клиент, я хочу…, чтобы…» и проверяемые критерии в формате Given/When/Then для основных и альтернативных сценариев"
      strong: "критерии для ошибок и недоступности внешних систем"
      keywords: ["как клиент|как покупател|я хочу", "чтобы", "given|when|then|дано|когда|тогда", "критери\\w* приёмк"]
    - id: systems
      title: Системы и крайние случаи
      weight: 1.1
      expect: "интеграции: платёжный шлюз (возврат), склад (снятие резерва/остановка сборки), лояльность (возврат/списание баллов), уведомления; крайние случаи: граница {{hours}} ч, отмена во время перехода статуса, оплата баллами частично"
      strong: "идемпотентность отмены, асинхронность возврата и статусы «отмена в обработке»"
      keywords: ["платёж|платеж|возврат", "склад|резерв", "лояльност|балл", "уведомлен|push|email", "{{hours}}|граничн|время", "одновремен|гонк|идемпотент"]
  probes:
    - criterion: systems
      text: "Заказ перешёл в «собирается на складе» ровно в момент нажатия «Отменить». Что должно произойти?"
      expect: "правило определено заранее: проверка статуса на сервере атомарно, отмена либо отклоняется с понятным сообщением, либо склад получает сигнал остановки"
      keywords: ["сервер|атомар|провер", "сообщени|отклон", "склад|останов"]
    - criterion: acceptance
      text: "Сформулируйте один критерий приёмки для возврата баллов в формате Given/When/Then."
      expect: "Дано: заказ оплачен частично баллами; Когда: клиент отменяет; Тогда: баллы возвращаются на счёт, деньги — на карту, начисленные за заказ баллы списываются"
      keywords: ["given|дано", "when|когда", "then|тогда", "балл"]
    - criterion: questions
      text: "Как вы поймёте через месяц после запуска, что фича нужна и работает?"
      expect: "метрики: доля отмен через приложение vs поддержку, нагрузка на поддержку, время возврата, ошибки интеграций"
      keywords: ["метрик|доля", "поддержк", "возврат|ошибк"]
  twist:
    text: "Юристы добавили требование: после передачи в доставку отмена возможна, но через возврат товара. Что меняется?"
    expect: "новый сценарий возврата: отдельный процесс и статусы, логистика обратной доставки, сроки возврата денег"
    keywords: ["возврат товар|сценари", "статус", "логистик|доставк", "срок"]

- id: an.senior.conversion_drop
  spec: analyst
  grade: senior
  skill: metrics
  title: Падение конверсии после релиза
  params:
    drop: [7, 12, 20]
  context: |
    После релиза новой страницы оформления заказа конверсия из корзины в покупку упала на {{drop}}% за
    неделю. Одновременно в релизе поменяли события аналитики, а маркетинг запустил промо на новую
    аудиторию. Команда хочет срочно откатить релиз.
  task: |
    Как вы установите, что произошло на самом деле? Какие данные и запросы понадобятся, какие выводы
    возможны и что вы порекомендуете команде?
  criteria:
    - id: hypotheses
      title: Гипотезы
      weight: 1.2
      expect: "три класса гипотез: поломка трекинга (метрика неверна), изменение аудитории (mix-эффект), реальная проблема новой страницы; проверка каждой"
      strong: "заранее определено, какие данные подтвердят/опровергнут каждую гипотезу"
      keywords: ["трекинг|событи|аналитик\\w* слом", "аудитор|mix|состав", "страниц|ux|баг", "гипотез"]
    - id: data
      title: Данные и проверки
      weight: 1.1
      expect: "сверка с первичными данными (заказы в БД/платежи) вместо событий, разбивка по сегментам (новая/старая аудитория, устройства, браузеры), воронка по шагам"
      strong: "сравнение когорт, проверка статистической значимости, A/B-тест или выключение фичи для части трафика"
      keywords: ["бд|заказ\\w* в|платеж|первичн", "сегмент|устройств|браузер", "воронк|шаг", "значим|a/b|ab.тест|когорт"]
    - id: conclusion
      title: Выводы и рекомендации
      weight: 1.0
      expect: "рекомендация, зависящая от результата проверок (не откатывать вслепую), быстрые проверки в первую очередь, коммуникация команде с уровнем уверенности"
      strong: "частичный откат/feature flag как компромисс"
      keywords: ["зависит|если.*то", "откат", "flag|флаг|част\\w* трафик", "уверенн|коммуникац"]
  probes:
    - criterion: data
      text: "Напишите, какой запрос (или псевдо-SQL) вы выполните первым и почему именно его."
      expect: "сверка числа оплаченных заказов в БД до/после релиза с событиями аналитики — проверка, сломан ли трекинг"
      keywords: ["select|count|запрос", "заказ|платеж|order", "до.*после|по дням|group by"]
    - criterion: hypotheses
      text: "Как отличить падение из-за новой аудитории промо от проблемы самой страницы?"
      expect: "сравнить конверсию старой аудитории (без промо) до/после релиза; если у неё не упала — эффект состава"
      keywords: ["старой аудитор|без промо|сегмент", "до.*после", "состав|mix"]
    - criterion: conclusion
      text: "Через 2 часа проверок данных ещё мало, а руководитель требует решения. Что скажете?"
      expect: "решение с учётом риска: частичный откат/флаг для части трафика или оставить с мониторингом, с явным уровнем уверенности и сроком следующей оценки"
      keywords: ["риск", "част|flag|флаг", "уверенн|срок|мониторинг"]
  twist:
    text: "Оказалось, что при оплате с iOS кнопка «Оплатить» перекрыта баннером промо. Как это меняет ваши выводы и что дальше?"
    expect: "реальная проблема в сегменте iOS: срочный фикс, оценка ущерба, проверка других сегментов, процесс проверки релизов"
    keywords: ["ios|сегмент", "фикс|исправ", "ущерб|оцен", "процесс|проверк"]

- id: an.lead.crm_merge
  spec: analyst
  grade: lead
  skill: requirements
  title: Объединение двух CRM после слияния
  params:
    clients: ["2 млн", "8 млн"]
  context: |
    Компания купила конкурента. У обеих компаний свои CRM с {{clients}} клиентов суммарно; около 15%
    клиентов есть в обеих системах с разными данными. Модели данных расходятся: «клиент» у одних —
    физлицо, у других — договор. Через 6 месяцев нужно единое окно для продаж и поддержки.
  task: |
    Как вы организуете аналитическую работу: от сбора требований до плана миграции? Какие решения
    нужно принять заранее и какие риски вы видите?
  criteria:
    - id: discovery
      title: Исследование и требования
      weight: 1.0
      expect: "карта процессов и стейкхолдеров обеих компаний, сценарии продаж и поддержки, приоритизация требований к единому окну"
      strong: "глоссарий терминов — общее понимание «клиента»"
      keywords: ["стейкхолдер|заинтересован", "процесс", "сценари", "глоссари|термин", "приоритет"]
    - id: data_model
      title: Модель данных
      weight: 1.3
      expect: "целевая модель (клиент-физлицо ↔ договоры), правила сопоставления дублей (matching), источник истины по каждому атрибуту, качество данных"
      strong: "мастер-данные (MDM), ручная проверка спорных совпадений, история изменений"
      keywords: ["модел\\w* данн", "дубл|сопоставл|matching|дедуплик", "источник истин|golden|мастер", "качеств\\w* данн", "mdm"]
    - id: migration
      title: Стратегия миграции
      weight: 1.0
      expect: "поэтапная миграция или период параллельной работы с синхронизацией, пробные миграции и сверка, план отката"
      strong: "единое окно поверх двух систем как промежуточный этап"
      keywords: ["поэтап|этап", "параллельн|синхрониз", "пробн|сверк", "откат", "поверх|промежуточн"]
    - id: risks
      title: Риски и решения
      weight: 0.8
      expect: "риски: качество данных, сроки, сопротивление пользователей, юридические (согласия на обработку ПДн, 152-ФЗ); решения, которые нужно принять заранее"
      strong: "владельцы решений и регулярный комитет"
      keywords: ["риск", "пдн|152|согласи|персональн", "сопротивлен|обучен", "срок", "решени\\w* заранее|владел"]
  probes:
    - criterion: data_model
      text: "Как вы определите, что запись «Иванов И.И.» в одной CRM и «Иванов Иван» в другой — один клиент?"
      expect: "правила сопоставления по нескольким атрибутам (телефон, email, ИНН/паспорт, дата рождения), веса/порог, ручная проверка спорных"
      keywords: ["телефон|email|инн|паспорт|дата рожд", "порог|вес|правил", "ручн|спорн"]
    - criterion: migration
      text: "Почему бы не перенести всех клиентов за одни выходные?"
      expect: "высокий риск ошибок и потери данных, нет возможности проверить и откатить; лучше поэтапно с пробными миграциями"
      keywords: ["риск", "провер|сверк", "откат", "поэтап"]
    - criterion: risks
      text: "Какие решения должен принять бизнес до начала работ, иначе проект встанет?"
      expect: "целевое понятие «клиента», система-источник для ключевых атрибутов, правила для конфликтов данных, юридические вопросы"
      keywords: ["клиент|определени", "источник", "конфликт", "юрид|согласи|пдн"]
  twist:
    text: "Выяснилось, что у купленной компании нет согласий клиентов на передачу данных третьим лицам. Как это влияет на план?"
    expect: "юридическая экспертиза, получение согласий или обезличивание, ограничение объёма переносимых данных, сдвиг сроков"
    keywords: ["юрид|юрист", "согласи", "обезлич|ограничен", "срок"]
