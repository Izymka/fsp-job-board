# Граф смежности технологий для частичного зачёта навыков при подборе.
#
# Ребро {from: X, to: Y, w} читается так: «кандидат владеет X → требование вакансии Y
# закрыто с долей w». Рёбра НАПРАВЛЕННЫЕ: обратное ребро задаётся явно и со своим весом
# (TypeScript → JavaScript = 0.8, JavaScript → TypeScript = 0.6).
#
# Шкала w (допустимы только эти значения):
#   0.8  — почти взаимозаменяемы, переход за дни (PostgreSQL → MySQL, TypeScript → JavaScript);
#   0.6  — та же категория, переучивание за недели (Django → FastAPI, React → Vue);
#   0.4  — близкая область, общий фундамент (RabbitMQ → Kafka);
#   0.25 — слабая связь, полезный задел (Docker → Kubernetes).
# Связи слабее 0.25 не заводятся.
#
# Имена — только канонические (первый элемент строки) из skills.yaml, раздел technologies.
# Рёбра «технология → её язык» (Django → Python) не заводятся: эта связь уже выражена
# через assess. Исключение — надмножества и родственные языки (TypeScript → JavaScript,
# Kotlin ↔ Java, C++ → C).
# Учтены алиасы словаря: Webpack покрывает Vite/esbuild, MobX — Zustand/React Query,
# Jest — Vitest, Playwright — Cypress, Prometheus — Grafana, CatBoost — бустинги в целом,
# Vue — Nuxt, MySQL — MariaDB, Elasticsearch — OpenSearch, S3 — MinIO.
