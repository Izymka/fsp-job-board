# ФСП: предложенная командой схема данных реестра (см. docs/fsp-integration.md)
fsp:
  levels:
    - {id: international, title: "Международные", weight: 1.0}
    - {id: national, title: "Всероссийские", weight: 0.75}
    - {id: regional, title: "Региональные", weight: 0.45}
    - {id: local, title: "Муниципальные и прочие", weight: 0.25}
  results:
    - {id: winner, title: "Победитель", weight: 1.0}
    - {id: prize, title: "Призёр", weight: 0.8}
    - {id: finalist, title: "Финалист", weight: 0.6}
    - {id: participant, title: "Участник", weight: 0.3}
  half_life_years: 2.0
  disciplines:
    # relevance — насколько дисциплина подтверждает навыки специализации (0..1)
    - id: algorithmic
      title: "Алгоритмическое программирование"
      relevance: {backend: 0.9, frontend: 0.5, mobile: 0.6, data_science: 0.8, qa: 0.4, devops: 0.5, analyst: 0.3}
    - id: product
      title: "Продуктовое программирование"
      relevance: {backend: 1.0, frontend: 1.0, mobile: 1.0, data_science: 0.7, qa: 0.7, devops: 0.7, analyst: 0.8}
    - id: security
      title: "Программирование систем информационной безопасности"
      relevance: {backend: 0.7, frontend: 0.4, mobile: 0.4, data_science: 0.4, qa: 0.5, devops: 1.0, analyst: 0.3}
    - id: robotics
      title: "Программирование робототехники"
      relevance: {backend: 0.5, frontend: 0.3, mobile: 0.4, data_science: 0.6, qa: 0.4, devops: 0.4, analyst: 0.2}
    - id: uav
      title: "Программирование беспилотных авиационных систем"
      relevance: {backend: 0.5, frontend: 0.3, mobile: 0.4, data_science: 0.7, qa: 0.4, devops: 0.4, analyst: 0.2}
