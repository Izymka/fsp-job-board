# Справочники платформы. Единый источник правды для бэкенда, фронтенда (через API) и валидации.
# Изменения порогов/весов — только здесь, с пересчётом `make validate`.

grades:
  # cut — порог на шкале способности θ (N(0,1) популяции специализации), выше которого грейд подтверждается.
  # Начальные значения экспертные; уточняются по пилоту и онлайн-перекалибровке.
  - {id: intern, name: Intern, title: "Стажёр", experience: "без коммерческого опыта", cut: -2.25}
  - {id: junior, name: Junior, title: "Младший специалист", experience: "до 1–2 лет", cut: -1.25}
  - {id: middle, name: Middle, title: "Специалист", experience: "2–4 года", cut: -0.25}
  - {id: senior, name: Senior, title: "Старший специалист", experience: "4+ лет", cut: 0.75}
  - {id: lead, name: Lead, title: "Ведущий / техлид", experience: "6+ лет, лидерство", cut: 1.6}

# Состав теста (blueprint) = ядро специализации + модули заявленного стека.
#   core    — фундамент специализации: проверяется у всех кандидатов категории, поэтому грейды
#             сопоставимы, а языконезависимые навыки служат якорями шкалы. Отбор — навыки, которые
#             есть почти у всех архетипов стека специализации (data/stack_archetypes.yaml), плюс
#             общепринятый фундамент (алгоритмы для разработчиков, статистика для DS).
#   modules — навыки, которые зависят от стека: входят в тест, только если их подтверждают
#             заявленные технологии (Django → python, React → react). Порядок — приоритет при
#             равенстве. Язык, по которому нет заданий (Java, Go, C#), ничем не подменяется:
#             тест опирается на ядро, а технология остаётся «заявленной».
blueprint_rules:
  max_modules: 3          # больше модулей — меньше заданий на навык и шумнее подоценки
  module_share: 0.2       # доля теста на один модуль …
  module_share_max: 0.4   # … но не больше этой доли на все модули: ядро — не меньше 60%

specializations:
  - id: backend
    name: Backend
    title: "Backend-разработка"
    description: "Серверная логика, API, базы данных, интеграции, производительность и надёжность сервисов"
    core: {algorithms: 0.25, sql: 0.3, http: 0.25, architecture: 0.2}
    modules: [python, javascript, typescript, docker, linux, security, kubernetes, cicd, git]
  - id: frontend
    name: Frontend
    title: "Frontend-разработка"
    description: "Веб-интерфейсы, браузер, JavaScript/TypeScript, React, вёрстка, взаимодействие с API"
    core: {javascript: 0.4, html_css: 0.3, http: 0.15, algorithms: 0.15}
    modules: [react, typescript, git]
  - id: mobile
    name: Mobile
    title: "Мобильная разработка"
    description: "Приложения для Android и iOS: жизненный цикл, UI, хранение данных, сеть, публикация"
    core: {mobile: 0.5, http: 0.2, algorithms: 0.15, architecture: 0.15}
    modules: [sql, react, javascript, typescript, git]
  - id: data_science
    name: Data Science
    title: "Data Science / ML"
    description: "Анализ данных, статистика, машинное обучение, подготовка признаков, оценка моделей"
    core: {ml: 0.4, statistics: 0.3, python: 0.3}
    modules: [cv, nlp, recsys, timeseries, pandas, sql, metrics]
    # Направления: кандидат выбирает в опросе (до 2). Навык направления входит в тест модулем с
    # приоритетом над стеком, а практический кейс берётся в предметной обёртке направления.
    directions:
      - {id: tabular, title: "Табличные данные и классический ML"}
      - {id: cv, title: "Компьютерное зрение (CV)", skill: cv}
      - {id: nlp, title: "Обработка текста (NLP)", skill: nlp}
      - {id: recsys, title: "Рекомендательные системы", skill: recsys}
      - {id: timeseries, title: "Временные ряды и прогнозирование", skill: timeseries}
  - id: qa
    name: QA
    title: "QA / тестирование"
    description: "Тест-дизайн, ручное и автоматизированное тестирование, API и баг-репорты"
    core: {testing: 0.7, http: 0.3}
    modules: [sql, python, javascript, mobile, cicd, git]
  - id: devops
    name: DevOps
    title: "DevOps / SRE"
    description: "Инфраструктура, контейнеры, CI/CD, наблюдаемость, сети и безопасность эксплуатации"
    core: {linux: 0.35, docker: 0.25, cicd: 0.2, http: 0.2}
    modules: [kubernetes, security, python, git, sql]
  - id: analyst
    name: Analyst
    title: "Системный / бизнес-аналитик"
    description: "Требования, моделирование процессов, интеграции, SQL и продуктовые метрики"
    core: {requirements: 0.5, sql: 0.5}
    modules: [metrics, http, statistics]

