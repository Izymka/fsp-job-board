# Архетипы технологических стеков IT-специалистов (российский рынок, 2026).
# Используются генератором синтетической популяции: и кандидат, и вакансия сэмплируются
# из одного архетипа своей специализации, поэтому технологии появляются реальными связками.
#
# Поля архетипа:
#   id       — уникальный идентификатор (snake_case, префикс — специализация);
#   spec     — id специализации из catalog.yaml (specializations);
#   title    — человекочитаемое название;
#   share    — доля архетипа среди специалистов этой специализации (сумма по spec = 1.0);
#   core     — 2–4 технологии, присутствующие почти всегда (p≈0.9);
#   common   — 3–7 технологий, встречающихся часто (p≈0.5);
#   optional — 2–6 технологий, встречающихся иногда (p≈0.2).
# Все имена — канонические имена из skills.yaml (раздел technologies).
# Близкие заменители (Kafka/RabbitMQ, React/Vue, Selenium/Playwright, GitLab CI/Jenkins и т. п.)
# намеренно разнесены по разным архетипам, а общие инструменты (Git, Docker, SQL, REST)
# повторяются — так возникают кандидаты со смежным, но не идентичным стеком.
