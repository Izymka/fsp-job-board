server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    # API бэкенда (включая Swagger /api/docs и callback ФСП ID)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # модели цифрового проктора (Human, MediaPipe): раздаются своим сервером, без внешних CDN
    location /models/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA: все остальные пути — index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options "SAMEORIGIN";  # SAMEORIGIN: скрытый iframe проверки SSO Keycloak
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        # камера и микрофон — только для своего origin (цифровой проктор); браузер всё равно спросит разрешение
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()";
    }
}
