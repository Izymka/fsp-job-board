[project]
name = "backend"
version = "0.1.0"
description = "ФСП Job Board API: модульный монолит на FastAPI"
requires-python = ">=3.12"
dependencies = [
    "fspml",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    "python-multipart>=0.0.17",
    "fpdf2>=2.8",
    "email-validator>=2.2",
]

[tool.uv.sources]
fspml = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
