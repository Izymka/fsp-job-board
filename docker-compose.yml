# ФСП Job Board — локальный запуск всего стека: `docker compose up -d --build`
# Приложение: http://localhost:18088 · Swagger: http://localhost:18088/api/docs · Keycloak: http://localhost:18080
# Письма (подтверждение email, уведомления): http://localhost:18025
# Суммарно ≈ 1.5–2 ГБ RAM (основной потребитель — Keycloak).

name: fsp-job-board

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://fsp:${POSTGRES_PASSWORD:-fsp}@postgres:5432/fsp_jobs
  AUTH_MODE: ${AUTH_MODE:-keycloak}
  KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:18080}
  KEYCLOAK_INTERNAL_URL: http://keycloak:8080
  FRONTEND_URL: ${PUBLIC_URL:-http://localhost:18088}
  PUBLIC_API_URL: ${PUBLIC_URL:-http://localhost:18088}
  CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:18088},http://localhost:5173
  FSP_REGISTRY_URL: http://fsp-registry:8090
  FSP_REGISTRY_API_KEY: ${FSP_REGISTRY_API_KEY:-fsp-registry-demo-key}
  FSP_ID_CLIENT_SECRET: ${FSP_ID_CLIENT_SECRET:-fsp-jobs-link-secret}
  ASSESSMENT_SECRET: ${ASSESSMENT_SECRET:-change-me-in-production-0123456789abcdef}
  WEBHOOK_SECRET: ${WEBHOOK_SECRET:-change-me-in-production-webhooks-0123456789}
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  EMAIL_ENABLED: ${EMAIL_ENABLED:-true}
  # Цифровой проктор: сверка лица 1:1 (local_demo — эталон в БД под AES-GCM; ebs — ЕБС)
  BIOMETRIC_PROVIDER: ${BIOMETRIC_PROVIDER:-local_demo}
  BIOMETRIC_KEY: ${BIOMETRIC_KEY:-biometric-demo-key-change-me-0123456789abcdef}
  SNAPSHOT_RETENTION_DAYS: ${SNAPSHOT_RETENTION_DAYS:-180}
  INVITE_QUOTA_PER_WEEK: ${INVITE_QUOTA_PER_WEEK:-30}
  # Механика подбора: v7 | v6 | v5 | hybrid | v1 | v4
  FSP_RANKER: ${FSP_RANKER:-v7}
  FSP_EMBEDDINGS: ${FSP_EMBEDDINGS:-auto}
  # Опциональный LLM (Yandex AI Studio): только запасной разбор резюме, по умолчанию выключен
  LLM_ENABLED: ${LLM_ENABLED:-0}
  RESUME_LLM_FALLBACK: ${RESUME_LLM_FALLBACK:-true}
  YC_FOLDER_ID: ${YC_FOLDER_ID:-}
  YC_API_KEY: ${YC_API_KEY:-}
  YC_LLM_BASE_URL: ${YC_LLM_BASE_URL:-https://ai.api.cloud.yandex.net/v1}
  YC_DATA_LOGGING: ${YC_DATA_LOGGING:-false}
  LLM_MODEL_EXTRACT: ${LLM_MODEL_EXTRACT:-yandexgpt-5-lite}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: fsp_jobs
      POSTGRES_USER: fsp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fsp}
    volumes:
      - pgdata18:/var/lib/postgresql
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsp -d fsp_jobs"]
      interval: 5s
      retries: 20
    mem_limit: 512m
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: fsp
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-fsp}
      # Токены выпускаются с публичным issuer; бэкенд ходит во внутреннюю сеть (backchannel)
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:18080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # За прокси фронтенда (/auth/) — схема и хост из X-Forwarded-*; прямые запросы на :18080 работают как раньше
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=65"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      retries: 30
    mem_limit: 1g
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "18025:8025"
    mem_limit: 64m
    restart: unless-stopped

  fsp-registry:
    build: ./fsp-registry-mock
    environment:
      FSP_REGISTRY_API_KEY: ${FSP_REGISTRY_API_KEY:-fsp-registry-demo-key}
    ports:
      - "18090:8090"
    mem_limit: 128m
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        WITH_EMBEDDINGS: ${WITH_EMBEDDINGS:-0}
    environment: *backend-env
    ports:
      - "18000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      fsp-registry:
        condition: service_started
    mem_limit: 1g
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      # Куда nginx фронтенда проксирует /api/ и /auth/ (см. frontend/nginx.conf.template)
      BACKEND_URL: http://backend:8000
      KEYCLOAK_URL: http://keycloak:8080
    ports:
      - "${HTTP_PORT:-18088}:80"
    depends_on:
      - backend
      - keycloak
    mem_limit: 64m
    restart: unless-stopped

volumes:
  pgdata18:
